<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.num{font-size:13px;font-weight:700;letter-spacing:2px;opacity:.75}
.ap{font-size:14.5px;font-weight:700}
.nom{font-size:13px}
.cod{font-size:12px;letter-spacing:1px}
.entra{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:entra .7s cubic-bezier(.2,.8,.3,1.2) forwards}
@keyframes entra{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.celda{animation:brillo 8s ease-in-out infinite}
@keyframes brillo{0%,85%,100%{stroke:#ffffff;stroke-width:3}92%{stroke:#f6c445;stroke-width:6}}
.estela{fill:none;stroke:#f6c445;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1 10;opacity:.6;animation:estela 1.3s linear infinite}
@keyframes estela{to{stroke-dashoffset:-22}}
.ala{transform-box:fill-box;transform-origin:50% 100%;animation:aleteo .11s ease-in-out infinite alternate}
.a2{animation-delay:.05s}
@keyframes aleteo{from{transform:scaleY(1)}to{transform:scaleY(.3)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.aparece,.entra{opacity:1!important}}
</style>
